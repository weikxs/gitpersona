name: CI

# One job per pull request, on Linux: format, vet, privacy, tests with
# coverage, lint, govulncheck, the configuration page in headless Chrome and
# the goreleaser config, one after another. A change to documentation alone
# finishes in seconds without running them; a draft runs nothing. Merging to
# main starts nothing, since the pull request was already tested.
# The Mac, arm64, other-distribution and install.sh runs are in full.yml,
# once a week. Branch rules require this job, `check`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          docs='\.md$|^docs/|^assets/|^LICENSE|^\.github/(ISSUE_TEMPLATE|release-notes)/|^\.github/(CODEOWNERS|pull_request_template\.md)$'
          if printf '%s\n' "$files" | grep -Ev "$docs" | grep -q .; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -Eq '^install\.sh$|^scripts/|^test/install/'; then install=true; else install=false; fi
          printf 'code=%s\ninstall=%s\n' "$code" "$install" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then echo "documentation only: nothing to test"; fi
      - if: steps.diff.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Format, vet, privacy, tests with coverage
        if: steps.diff.outputs.code == 'true'
        run: make check
      - name: Lint
        if: steps.diff.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      # Known vulnerabilities in the Go standard library and the modules
      # GitPersona uses, reported only when the code can reach them.
      - name: govulncheck
        if: steps.diff.outputs.code == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Configuration page (headless Chrome)
        if: steps.diff.outputs.code == 'true'
        run: make e2e
      - name: goreleaser check
        if: steps.diff.outputs.code == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      - name: Shellcheck the install script
        if: steps.diff.outputs.install == 'true'
        run: shellcheck install.sh scripts/*.sh test/install/*.sh
