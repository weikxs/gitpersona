<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{CSRF}}">
<meta name="system-lang" content="{{LANG}}">
<title>GitPersona</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main" id="skip-link">Skip to content</a>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" fill="currentColor"/>
        <circle cx="16" cy="12.5" r="5" fill="none" stroke="var(--logo-ink)" stroke-width="2.4"/>
        <path d="M7.5 25.5c1.6-4.1 4.8-6.3 8.5-6.3s6.9 2.2 8.5 6.3" fill="none" stroke="var(--logo-ink)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>GitPersona</h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="lang-switch" role="group" id="lang-switch"></div>
      <button type="button" id="close" class="small ghost"></button>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div id="status" role="status" aria-live="polite"></div>
    <div id="view"><p class="loading">…</p></div>
  </main>
</div>
<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button value="cancel" type="submit" id="confirm-cancel"></button>
      <button value="ok" type="submit" id="confirm-ok" class="danger"></button>
    </div>
  </form>
</dialog>
</body>
</html>
