version: 2

project_name: gitpersona

before:
  hooks:
    - go mod tidy

builds:
  - id: gitpersona
    main: ./cmd/gitpersona
    binary: gitpersona
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/weikxs/gitpersona/internal/version.version={{ .Version }}
      - -X github.com/weikxs/gitpersona/internal/version.commit={{ .ShortCommit }}
      - -X github.com/weikxs/gitpersona/internal/version.date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

# Linux packages: the system's package manager installs /usr/bin/gitpersona,
# a path that stays the same across upgrades (the Git configuration calls it).
nfpms:
  - id: linux-packages
    package_name: gitpersona
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/weikxs/gitpersona
    maintainer: Weikxs <weikxs.dev@gmail.com>
    description: Git profiles that follow your directories
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/gitpersona/LICENSE
      - src: README.md
        dst: /usr/share/doc/gitpersona/README.md

checksum:
  name_template: checksums.txt

# Named explicitly, so links in the release and the cask never depend on the
# remote of the checkout.
release:
  github:
    owner: weikxs
    name: gitpersona
  name_template: "GitPersona {{ .Tag }}"

# The release notes come from CHANGELOG.md (scripts/release-notes.sh); the
# list of commits, with their hashes and author emails, is not used.
changelog:
  disable: true

homebrew_casks:
  - name: gitpersona
    repository:
      owner: weikxs
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key that can write only to the tap; the
      # private key is the HOMEBREW_TAP_SSH_KEY secret of this repository.
      git:
        url: "git@github.com:weikxs/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    commit_author:
      name: Weikxs
      email: weikxs.dev@gmail.com
    homepage: https://github.com/weikxs/gitpersona
    description: Git profiles that follow your directories
    license: MIT
    # The binary is not signed or notarized (and will not be), so Gatekeeper would refuse it
    # ("is damaged and cannot be opened"); remove the quarantine bit that
    # Homebrew sets on download. See SECURITY.md.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gitpersona"]
          end
